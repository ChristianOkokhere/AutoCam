[project]
name = "autocam"
version = "0.0.1"
description = "Natural-language RAW photo editor in your terminal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christian Okokhere" }]
keywords = ["photo", "editor", "raw", "tui", "llm", "claude"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
]
# Phase 0 ships with no runtime deps. Image / TUI / LLM deps land in later phases.
dependencies = []

[project.scripts]
autocam = "autocam.__main__:main"

[project.urls]
Homepage = "https://github.com/ChristianOkokhere/AutoCam"
Issues = "https://github.com/ChristianOkokhere/AutoCam/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocam"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
