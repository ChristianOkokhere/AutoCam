[project]
name = "autocam"
version = "0.1.0"
description = "Natural-language RAW photo editor in your terminal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christian Okokhere" }]
keywords = ["photo", "editor", "raw", "tui", "llm", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
]
# Phase 3 lands the LLM loop. RAW / mask deps come later.
dependencies = [
    "anthropic>=0.100",
    "numpy>=2.0",
    "pillow>=11.0",
    "rawpy>=0.27.0",
    "textual>=0.86",
    "textual-image>=0.12",
]

[project.scripts]
# The installed command is `create` (short, verb-first, claude-code-esque).
# The Python package stays `autocam` — `pip install autocam`, `import autocam`.
create = "autocam.cli:main"

[project.urls]
Homepage = "https://github.com/ChristianOkokhere/AutoCam"
Issues = "https://github.com/ChristianOkokhere/AutoCam/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocam"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"
